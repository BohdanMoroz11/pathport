name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - phase-*

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: pathport
          POSTGRES_USER: pathport
          POSTGRES_PASSWORD: pathport
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U pathport -d pathport"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.17.1

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Build workspace packages
        run: pnpm build:packages

      - name: Biome check
        run: pnpm check

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit, component, and API tests
        run: pnpm test:coverage

      - name: Build
        run: pnpm build

      - name: Playwright E2E
        run: pnpm test:e2e
        env:
          DATABASE_URL: postgres://pathport:pathport@localhost:5433/pathport

      # Audits the production stack: the build above plus a freshly seeded DB,
      # which start-stack.mjs serves through the real API + `next start`.
      - name: Lighthouse CI
        run: pnpm db:seed && pnpm lhci
        env:
          DATABASE_URL: postgres://pathport:pathport@localhost:5433/pathport

