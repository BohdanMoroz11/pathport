name: pathport

services:
  db:
    image: postgres:16-alpine
    container_name: pathport-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: pathport
      POSTGRES_PASSWORD: pathport
      POSTGRES_USER: pathport
    ports:
      - "127.0.0.1:4312:5432"
    volumes:
      - pathport_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pathport -d pathport"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: pathport-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:4313:6379"
    volumes:
      - pathport_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pathport_db_data:
  pathport_redis_data:
