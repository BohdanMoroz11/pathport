name: pathport

services:
  db:
    image: postgres:16-alpine
    container_name: pathport-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: pathport
      POSTGRES_PASSWORD: pathport
      POSTGRES_USER: pathport
    ports:
      - "127.0.0.1:4312:5432"
    volumes:
      - pathport_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pathport -d pathport"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pathport_db_data:
